name: GLaDOS 2026 Checkin

on:
  # 自动签到已迁移到本地浏览器；云端不再定时执行，仅保留手动入口。
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: 仅保留手动运行；自动签到由本地 Windows 任务执行
        required: false
        default: manual
        type: choice
        options:
          - manual

concurrency:
  group: glados-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    if: github.event_name == 'workflow_dispatch' && inputs.dispatch_source == 'manual'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      - name: Run Checkin
        run: python checkin.py
        timeout-minutes: 8
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          # Must match the browser that created the current gld:sess.
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSH_LEVEL: ${{ vars.PUSH_LEVEL || 'fail_only' }}
          EXCHANGE_PLAN: 'off'
          CHECKIN_MAX_ATTEMPTS: '3'
          CHECKIN_RETRY_DELAY_SECONDS: '60'
